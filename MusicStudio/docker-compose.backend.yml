services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: musicstudio-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - /app/node_modules
