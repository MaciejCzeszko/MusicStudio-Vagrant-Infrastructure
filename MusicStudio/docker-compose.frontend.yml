services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: musicstudio-frontend
    restart: unless-stopped
    ports:
      - 5173:5173
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
